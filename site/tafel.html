<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Tafel · Interaktive Wandtafel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='20' rx='3' fill='%232c4f3c'/%3E%3Cpath d='M8 18c3-6 6 2 9-3s4 1 7-2' stroke='white' stroke-width='2' fill='none'/%3E%3Crect x='10' y='26' width='12' height='2' rx='1' fill='%23e4572e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/basis.css">
  <link rel="stylesheet" href="css/tafel.css">
</head>
<body class="oberflaeche tafel-seite" data-modus="bearbeiten">
  <header class="tafel-leiste" id="leiste">
    <div class="leiste-gruppe">
      <a class="marke-punkt" href="index.html" id="zur-uebersicht" title="Zur Übersicht (Fächer und Kapitel)">IW</a>
      <div class="tafel-titel">
        <label class="unsichtbar" for="titel">Titel der Tafel</label>
        <input id="titel" type="text" value="" autocomplete="off" spellcheck="false">
        <a id="ort" href="index.html">Übersicht</a>
      </div>
    </div>

    <div class="leiste-gruppe" role="group" aria-label="Modus">
      <button type="button" class="t-knopf aktiv" data-modus="bearbeiten" data-icon="zeiger" title="Bearbeiten: Elemente verschieben und ändern (Z)">Bearbeiten</button>
      <button type="button" class="t-knopf" data-modus="zeichnen" data-icon="stift" title="Zeichnen: auf die ganze Seite schreiben (Z)">Zeichnen</button>
    </div>

    <div class="leiste-gruppe nur-bearbeiten" role="group" aria-label="Einfügen">
      <button type="button" class="t-knopf" data-neu="text" data-icon="text" title="Textfeld">Text</button>
      <button type="button" class="t-knopf" data-neu="notiz" data-icon="notiz" title="Notizzettel">Notiz</button>
      <button type="button" class="t-knopf" data-neu="bild" data-icon="bild" title="Bild hochladen oder Adresse (auch Ctrl+V oder Hineinziehen)">Bild</button>
      <button type="button" class="t-knopf" data-neu="video" data-icon="video" title="Video: YouTube, Vimeo, Videodatei">Video</button>
      <button type="button" class="t-knopf" data-neu="webseite" data-icon="webseite" title="Webseite einbinden">Webseite</button>
      <button type="button" class="t-knopf" data-neu="link" data-icon="link" title="Link als Karte">Link</button>
      <button type="button" class="t-knopf" id="module-knopf" data-icon="timer" aria-haspopup="true" aria-expanded="false" title="Timer, Stoppuhr, Zufall, Gruppen, Würfel">Module</button>
    </div>

    <div class="leiste-gruppe nur-zeichnen" role="group" aria-label="Zeichenwerkzeuge">
      <button type="button" class="t-knopf aktiv" data-werkzeug="stift" data-icon="stift" title="Stift">Stift</button>
      <button type="button" class="t-knopf" data-werkzeug="marker" data-icon="marker" title="Textmarker">Marker</button>
      <button type="button" class="t-knopf" data-werkzeug="radierer" data-icon="radierer" title="Radierer">Radierer</button>
      <span class="farben" id="farben"></span>
      <span class="dicken" id="dicken"></span>
      <button type="button" class="t-knopf" id="zeichnung-loeschen" data-icon="muell" title="Alle Zeichnungen dieser Seite löschen">Zeichnung</button>
    </div>

    <div class="leiste-gruppe leiste-rechts">
      <label class="unsichtbar" for="hintergrund">Hintergrund</label>
      <select id="hintergrund" title="Hintergrund dieser Seite"></select>
      <button type="button" class="t-knopf nur-icon" id="rueckgaengig" data-icon="zurueck" title="Rückgängig (Ctrl+Z)" aria-label="Rückgängig"></button>
      <button type="button" class="t-knopf nur-icon" id="wiederholen" data-icon="vor" title="Wiederholen (Ctrl+Y)" aria-label="Wiederholen"></button>
      <button type="button" class="t-knopf aktiv" id="seiten-knopf" data-icon="seiten" title="Seitenliste ein- und ausblenden">Seiten</button>
      <button type="button" class="t-knopf" id="export-knopf" data-icon="export" aria-haspopup="true" aria-expanded="false" title="Exportieren: HTML, PDF, Wandtafel-Datei">Exportieren</button>
      <button type="button" class="t-knopf t-akzent" id="praesentieren" data-icon="praesentieren" title="Präsentieren (P)">Präsentieren</button>
    </div>
  </header>

  <div class="tafel-haupt">
    <aside class="seitenliste" id="seitenliste" aria-label="Seiten">
      <ol id="seiten"></ol>
      <button type="button" class="knopf seite-neu" id="seite-neu">+ Seite</button>
    </aside>
    <div class="tafel-rahmen" id="rahmen">
      <div class="tafel hg-weiss" id="tafel">
        <div class="ebene-elemente" id="elemente"></div>
        <canvas class="ebene-zeichnung" id="zeichnung" width="3200" height="1800"></canvas>
      </div>
    </div>
  </div>

  <nav class="praes-leiste" id="praes-leiste" aria-label="Präsentation" hidden>
    <button type="button" class="p-knopf" id="p-zurueck" data-icon="links" title="Vorherige Seite (Pfeil links)" aria-label="Vorherige Seite"></button>
    <span class="praes-nummer" id="p-nummer">1 / 1</span>
    <button type="button" class="p-knopf" id="p-weiter" data-icon="rechts" title="Nächste Seite (Pfeil rechts)" aria-label="Nächste Seite"></button>
    <span class="praes-titel" id="p-titel"></span>
    <button type="button" class="p-knopf" id="p-zeichnen" data-icon="stift" title="Zeichnen ein/aus (Z)" aria-label="Zeichnen"></button>
    <button type="button" class="p-knopf" id="p-radierer" data-icon="radierer" title="Radierer" aria-label="Radierer"></button>
    <button type="button" class="p-knopf" id="p-rueckgaengig" data-icon="zurueck" title="Rückgängig (Ctrl+Z)" aria-label="Rückgängig"></button>
    <button type="button" class="p-knopf" id="p-ende" data-icon="schliessen" title="Präsentation beenden (Esc)" aria-label="Präsentation beenden"></button>
  </nav>

  <input type="file" id="bild-datei" accept="image/*" hidden>
  <input type="file" id="import-datei" accept=".json,.html,application/json,text/html" hidden>
  <script src="js/gemeinsam.js"></script>
  <script src="js/speicher.js"></script>
  <script src="js/elemente.js"></script>
  <script src="js/export.js"></script>
  <script src="js/tafel.js"></script>
</body>
</html>
